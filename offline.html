<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - VAREEN Academy</title>
    <meta name="description" content="You're currently offline. Please check your internet connection and try again.">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="manifest" href="/manifest.json">
    <style>
        .offline-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            text-align: center;
            padding: 2rem;
        }
        .offline-content {
            max-width: 500px;
        }
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        .retry-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.8);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            text-decoration: none;
            display: inline-block;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }
        .retry-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <main class="offline-container">
        <div class="offline-content">
            <div class="offline-icon">📱</div>
            <h1>You're Offline</h1>
            <p>It looks like you've lost your internet connection. Don't worry, you can still browse some of our cached content.</p>
            <p>Check your connection and try refreshing the page, or continue exploring our available content.</p>
            <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
        </div>
    </main>

    <script>
        // Check for online status
        function updateOnlineStatus() {
            const offlineMessage = document.querySelector('.offline-content p');
            if (navigator.onLine) {
                offlineMessage.textContent = "Great! You're back online. You can now access all our features.";
                setTimeout(() => {
                    window.location.reload();
                }, 2000);
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        // Service worker registration check
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.ready.then((registration) => {
                console.log('Service worker ready for offline functionality');
            });
        }
    </script>
</body>
</html>
