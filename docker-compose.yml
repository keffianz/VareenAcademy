version: '3.8'

services:
  site:
    image: nginx:alpine
    volumes:
      - ./:/usr/share/nginx/html:ro
    ports:
      - "8000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 5

  visual:
    build:
      context: .
      dockerfile: tools/docker/lighthouse/Dockerfile
    depends_on:
      site:
        condition: service_healthy
    environment:
      - BASE_URL=http://site
    command: ["node", "tools/visual-check.js", "--base", "http://site"]
    # Allow the container to access the host network if needed (uncomment if required)
    # network_mode: host

  lighthouse:
    build:
      context: .
      dockerfile: tools/docker/lighthouse/Dockerfile
    depends_on:
      site:
        condition: service_healthy
    volumes:
      - ./:/usr/src/app:rw
    environment:
      - NODE_ENV=production
    command: ["/bin/sh","-c","mkdir -p /usr/src/app/lighthouse-reports && npx -y lighthouse http://site --output html --output json --output-path /usr/src/app/lighthouse-reports/lighthouse-$(date +%Y%m%d-%H%M%S).report.html --quiet --chrome-flags='--no-sandbox --headless' --only-categories=performance,accessibility,best-practices,seo"]

networks:
  default:
    driver: bridge

