; VAREEN LMS — Hostinger PHP runtime overrides (read by LiteSpeed/Apache
; user-ini on every request in this directory tree).
; Hostinger shared hosting caps some of these on lower plans — if upload of a
; large video fails with "exceeds the server limit", raise the plan cap in
; hPanel → Advanced → PHP Configuration.

upload_max_filesize = 500M
post_max_size = 500M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
max_file_uploads = 20
