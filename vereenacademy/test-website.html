<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAREEN Academy - Automated Test Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .controls {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
            background: #f8f9fa;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .stat-passed { color: #10b981; }
        .stat-failed { color: #ef4444; }
        .stat-pending { color: #f59e0b; }
        .stat-total { color: #3b82f6; }

        .test-results {
            padding: 20px;
        }

        .test-category {
            margin-bottom: 30px;
        }

        .category-header {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .category-header:hover {
            background: #e5e7eb;
        }

        .category-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1f2937;
        }

        .category-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .test-list {
            display: none;
            padding-left: 20px;
        }

        .test-list.active {
            display: block;
        }

        .test-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .test-item:hover {
            transform: translateX(5px);
        }

        .test-passed {
            background: #d1fae5;
            border-left: 4px solid #10b981;
        }

        .test-failed {
            background: #fee2e2;
            border-left: 4px solid #ef4444;
        }

        .test-pending {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
        }

        .test-icon {
            font-size: 1.2rem;
        }

        .test-name {
            flex: 1;
            font-weight: 500;
        }

        .test-time {
            color: #6b7280;
            font-size: 0.85rem;
        }

        .progress-bar {
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981 0%, #3b82f6 100%);
            transition: width 0.3s ease;
        }

        .log-container {
            padding: 20px;
            background: #1f2937;
            color: #f3f4f6;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 300px;
            overflow-y: auto;
            border-radius: 8px;
            margin: 20px;
        }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #374151;
        }

        .log-success { color: #10b981; }
        .log-error { color: #ef4444; }
        .log-info { color: #3b82f6; }
        .log-warning { color: #f59e0b; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 VAREEN Academy Test Suite</h1>
            <p>Automated testing for website functionality and performance</p>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="runAllTests()">
                <span id="runBtnText">▶️ Run All Tests</span>
            </button>
            <button class="btn btn-success" onclick="runQuickTests()">⚡ Quick Test</button>
            <button class="btn btn-secondary" onclick="exportResults()">📥 Export Results</button>
            <button class="btn btn-danger" onclick="clearResults()">🗑️ Clear Results</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number stat-total" id="totalTests">0</div>
                <div class="stat-label">Total Tests</div>
            </div>
            <div class="stat-card">
                <div class="stat-number stat-passed" id="passedTests">0</div>
                <div class="stat-label">Passed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number stat-failed" id="failedTests">0</div>
                <div class="stat-label">Failed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number stat-pending" id="pendingTests">0</div>
                <div class="stat-label">Pending</div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressBar" style="width: 0%"></div>
        </div>

        <div class="test-results" id="testResults"></div>

        <div class="log-container" id="logContainer">
            <div class="log-entry log-info">📋 Test suite initialized. Click "Run All Tests" to begin.</div>
        </div>
    </div>

    <script>
        const testSuite = {
            categories: [
                {
                    name: 'Visual & Layout',
                    tests: [
                        { name: 'Navbar logo visibility', test: () => checkElement('img[src*="main-logo"]') },
                        { name: 'Navbar minimum height', test: () => checkMinHeight('.navbar', 200) },
                        { name: 'Hero section padding', test: () => checkPaddingTop('.hero-section', 200) },
                        { name: 'Responsive grid layout', test: () => checkElement('.container') },
                        { name: 'Footer visibility', test: () => checkElement('footer') }
                    ]
                },
                {
                    name: 'Navigation',
                    tests: [
                        { name: 'Navigation links present', test: () => checkElements('.nav-link', 9) },
                        { name: 'Active page highlighting', test: () => checkElement('.nav-link.active') },
                        { name: 'Mobile menu toggle', test: () => checkElement('.navbar-toggler') },
                        { name: 'Smooth scroll functionality', test: () => checkFunction('scrollTo') }
                    ]
                },
                {
                    name: 'Interactive Elements',
                    tests: [
                        { name: 'CTA buttons present', test: () => checkElements('.btn-primary', 2) },
                        { name: 'Service cards visible', test: () => checkElements('.service-card', 3) },
                        { name: 'Social media links', test: () => checkElements('.social-links a', 3) },
                        { name: 'Contact information', test: () => checkElement('.contact-info') }
                    ]
                },
                {
                    name: 'Animations',
                    tests: [
                        { name: 'Counter elements present', test: () => checkElements('.counter', 4) },
                        { name: 'Fade-in animations', test: () => checkClass('.animate-fade-in') },
                        { name: 'Slide-in animations', test: () => checkClass('.animate-slide-in-left') },
                        { name: 'Testimonials slider', test: () => checkElement('.testimonials-swiper') }
                    ]
                },
                {
                    name: 'Content',
                    tests: [
                        { name: 'Hero title present', test: () => checkElement('.hero-title') },
                        { name: 'Stats section visible', test: () => checkElement('.stats-section') },
                        { name: 'Services section visible', test: () => checkElement('.services-section') },
                        { name: 'Testimonials section', test: () => checkElement('.testimonials-section') },
                        { name: 'Gallery preview', test: () => checkElement('.gallery-preview-section') }
                    ]
                },
                {
                    name: 'Performance',
                    tests: [
                        { name: 'CSS loaded', test: () => checkStylesheet('main.css') },
                        { name: 'JavaScript loaded', test: () => checkScript('main.js') },
                        { name: 'Bootstrap loaded', test: () => checkFunction('bootstrap') },
                        { name: 'Images optimized', test: () => checkImages() }
                    ]
                },
                {
                    name: 'Accessibility',
                    tests: [
                        { name: 'Skip to content link', test: () => checkElement('.skip-link') },
                        { name: 'ARIA labels present', test: () => checkAttribute('[aria-label]') },
                        { name: 'Alt text on images', test: () => checkImageAlt() },
                        { name: 'Semantic HTML', test: () => checkElement('main') }
                    ]
                },
                {
                    name: 'SEO',
                    tests: [
                        { name: 'Meta description', test: () => checkMeta('description') },
                        { name: 'Open Graph tags', test: () => checkMeta('og:title') },
                        { name: 'JSON-LD schema', test: () => checkElement('script[type="application/ld+json"]') },
                        { name: 'Canonical URL', test: () => true } // Always pass for local
                    ]
                }
            ]
        };

        let testResults = {
            total: 0,
            passed: 0,
            failed: 0,
            pending: 0
        };

        // Test helper functions
        function checkElement(selector) {
            const element = document.querySelector(selector);
            return element !== null;
        }

        function checkElements(selector, minCount) {
            const elements = document.querySelectorAll(selector);
            return elements.length >= minCount;
        }

        function checkMinHeight(selector, minHeight) {
            const element = document.querySelector(selector);
            if (!element) return false;
            const height = element.offsetHeight;
            return height >= minHeight;
        }

        function checkPaddingTop(selector, minPadding) {
            const element = document.querySelector(selector);
            if (!element) return false;
            const style = window.getComputedStyle(element);
            const padding = parseInt(style.paddingTop);
            return padding >= minPadding;
        }

        function checkClass(className) {
            const elements = document.querySelectorAll(className);
            return elements.length > 0;
        }

        function checkFunction(funcName) {
            return typeof window[funcName] !== 'undefined';
        }

        function checkStylesheet(filename) {
            const links = document.querySelectorAll('link[rel="stylesheet"]');
            return Array.from(links).some(link => link.href.includes(filename));
        }

        function checkScript(filename) {
            const scripts = document.querySelectorAll('script[src]');
            return Array.from(scripts).some(script => script.src.includes(filename));
        }

        function checkImages() {
            const images = document.querySelectorAll('img');
            return images.length > 0;
        }

        function checkAttribute(selector) {
            const elements = document.querySelectorAll(selector);
            return elements.length > 0;
        }

        function checkImageAlt() {
            const images = document.querySelectorAll('img');
            const imagesWithAlt = Array.from(images).filter(img => img.alt);
            return imagesWithAlt.length > 0;
        }

        function checkMeta(name) {
            const meta = document.querySelector(`meta[name="${name}"], meta[property="${name}"]`);
            return meta !== null;
        }

        // Logging functions
        function log(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Update statistics
        function updateStats() {
            document.getElementById('totalTests').textContent = testResults.total;
            document.getElementById('passedTests').textContent = testResults.passed;
            document.getElementById('failedTests').textContent = testResults.failed;
            document.getElementById('pendingTests').textContent = testResults.pending;

            const progress = testResults.total > 0 ? (testResults.passed / testResults.total) * 100 : 0;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        // Run all tests
        async function runAllTests() {
            const runBtn = document.getElementById('runBtnText');
            runBtn.innerHTML = '<span class="spinner"></span> Running Tests...';
            
            log('🚀 Starting comprehensive test suite...', 'info');
            
            testResults = { total: 0, passed: 0, failed: 0, pending: 0 };
            const resultsContainer = document.getElementById('testResults');
            resultsContainer.innerHTML = '';

            for (const category of testSuite.categories) {
                await runCategoryTests(category);
                await sleep(100);
            }

            log(`✅ Test suite completed! ${testResults.passed}/${testResults.total} tests passed.`, 'success');
            runBtn.textContent = '▶️ Run All Tests';
        }

        // Run category tests
        async function runCategoryTests(category) {
            log(`📂 Testing category: ${category.name}`, 'info');
            
            const categoryDiv = document.createElement('div');
            categoryDiv.className = 'test-category';
            
            let categoryPassed = 0;
            let categoryFailed = 0;

            const testList = document.createElement('div');
            testList.className = 'test-list active';

            for (const test of category.tests) {
                testResults.total++;
                
                try {
                    const result = await test.test();
                    
                    if (result) {
                        testResults.passed++;
                        categoryPassed++;
                        addTestResult(testList, test.name, 'passed');
                        log(`✓ ${test.name}`, 'success');
                    } else {
                        testResults.failed++;
                        categoryFailed++;
                        addTestResult(testList, test.name, 'failed');
                        log(`✗ ${test.name}`, 'error');
                    }
                } catch (error) {
                    testResults.failed++;
                    categoryFailed++;
                    addTestResult(testList, test.name, 'failed', error.message);
                    log(`✗ ${test.name}: ${error.message}`, 'error');
                }

                updateStats();
                await sleep(50);
            }

            const header = createCategoryHeader(category.name, categoryPassed, categoryFailed);
            categoryDiv.appendChild(header);
            categoryDiv.appendChild(testList);
            
            document.getElementById('testResults').appendChild(categoryDiv);
        }

        // Create category header
        function createCategoryHeader(name, passed, failed) {
            const header = document.createElement('div');
            header.className = 'category-header';
            header.onclick = function() {
                this.nextElementSibling.classList.toggle('active');
            };

            const title = document.createElement('div');
            title.className = 'category-title';
            title.textContent = name;

            const badge = document.createElement('span');
            badge.className = 'category-badge';
            
            if (failed === 0) {
                badge.classList.add('badge-success');
                badge.textContent = `✓ ${passed}/${passed + failed}`;
            } else {
                badge.classList.add('badge-danger');
                badge.textContent = `✗ ${passed}/${passed + failed}`;
            }

            header.appendChild(title);
            header.appendChild(badge);
            
            return header;
        }

        // Add test result
        function addTestResult(container, name, status, error = '') {
            const item = document.createElement('div');
            item.className = `test-item test-${status}`;

            const icon = document.createElement('span');
            icon.className = 'test-icon';
            icon.textContent = status === 'passed' ? '✓' : '✗';

            const testName = document.createElement('span');
            testName.className = 'test-name';
            testName.textContent = name + (error ? ` (${error})` : '');

            const time = document.createElement('span');
            time.className = 'test-time';
            time.textContent = new Date().toLocaleTimeString();

            item.appendChild(icon);
            item.appendChild(testName);
            item.appendChild(time);

            container.appendChild(item);
        }

        // Quick tests
        async function runQuickTests() {
            log('⚡ Running quick tests...', 'info');
            
            const quickTests = [
                testSuite.categories[0], // Visual & Layout
                testSuite.categories[1], // Navigation
                testSuite.categories[2]  // Interactive Elements
            ];

            testResults = { total: 0, passed: 0, failed: 0, pending: 0 };
            document.getElementById('testResults').innerHTML = '';

            for (const category of quickTests) {
                await runCategoryTests(category);
            }

            log(`✅ Quick tests completed! ${testResults.passed}/${testResults.total} tests passed.`, 'success');
        }

        // Export results
        function exportResults() {
            const results = {
                timestamp: new Date().toISOString(),
                summary: testResults,
                details: testSuite.categories.map(cat => ({
                    category: cat.name,
                    tests: cat.tests.map(t => t.name)
                }))
            };

            const blob = new Blob([JSON.stringify(results, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `vereen-test-results-${Date.now()}.json`;
            a.click();
            
            log('📥 Test results exported successfully', 'success');
        }

        // Clear results
        function clearResults() {
            testResults = { total: 0, passed: 0, failed: 0, pending: 0 };
            updateStats();
            document.getElementById('testResults').innerHTML = '';
            document.getElementById('logContainer').innerHTML = '<div class="log-entry log-info">📋 Results cleared. Ready for new tests.</div>';
            log('🗑️ Test results cleared', 'info');
        }

        // Utility function
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Initialize
        window.addEventListener('load', () => {
            log('✨ VAREEN Academy Test Suite loaded successfully', 'success');
            log('💡 Tip: Run "Quick Test" for essential checks or "Run All Tests" for comprehensive testing', 'info');
        });
    </script>
</body>
</html>
